[package]
name = "asbdata-ghana-desktop"
version = "1.0.0"
description = "ASBData Ghana admin dashboard as a native desktop app"
authors = ["ASBData Ghana"]
edition = "2021"

[lib]
name = "asbdata_ghana_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
